<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentos para leer y jugar</title>
<style>
:root{--bg:#FFF7E8;--card:#FFFFFF;--tx:#3B2F4F;--mut:#6E6283;--ac:#7656B5;--onac:#FFFFFF;--coral:#FF987F;--mint:#BFE8D5;--ok:#1F6F50;--okbg:#DDF5EA;--no:#FFE9DF;--bd:#E8DCC8;--star:#F2A93B;--fs:26px;--ls:.02em;--lh:1.6;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2B2440;--card:#3A3157;--tx:#F4EEFF;--mut:#BDB1D6;--ac:#B79CF0;--onac:#231A38;--ok:#8FE0BC;--okbg:#27493F;--no:#4A3A3A;--bd:#54497A}}
:root[data-theme="dark"]{--bg:#2B2440;--card:#3A3157;--tx:#F4EEFF;--mut:#BDB1D6;--ac:#B79CF0;--onac:#231A38;--ok:#8FE0BC;--okbg:#27493F;--no:#4A3A3A;--bd:#54497A}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:'Trebuchet MS','Lucida Grande','Segoe UI',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:14px 16px 28px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}
h1{font-size:28px;line-height:1.25;margin:4px 0 0;font-weight:700;text-align:center}
p{margin:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{font:inherit;font-size:20px;font-weight:700;min-height:58px;padding:12px 22px;border-radius:24px;border:3px solid #CDBFEA;background:var(--card);color:var(--tx);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn.main{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.btn.sq{min-width:58px;padding:12px}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,.chip:focus-visible{outline:4px solid var(--tx);outline-offset:3px}
.story{width:100%;text-align:left;font:inherit;display:flex;align-items:center;gap:14px;background:var(--card);color:var(--tx);border:3px solid var(--mint);border-radius:26px;padding:12px;cursor:pointer}
.story .th{width:42%;flex:none;border-radius:16px;overflow:hidden}
.story b{font-size:22px;display:block;margin-bottom:6px}
.story span{color:var(--mut);font-size:16px}
.panel{background:var(--card);border:3px solid var(--bd);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:19px}
.chip{font:inherit;font-size:18px;min-height:48px;padding:8px 18px;border-radius:999px;border:3px solid #CDBFEA;background:var(--card);color:var(--tx);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ac);border-color:var(--ac);color:var(--onac)}
.bar{height:14px;border-radius:99px;background:var(--bd);overflow:hidden}
.bar i{display:block;height:100%;background:var(--coral);border-radius:99px}
.pic{border-radius:28px;overflow:hidden;border:4px solid var(--mint);background:#F1DDB0}.cap{padding:0 12px 14px;display:flex;flex-direction:column;align-items:center;gap:10px}.cap .paper{background:#FFF7E8;color:#3B2F4F;border-radius:22px;padding:16px;width:100%;box-sizing:border-box;text-align:center}.cap .btn{background:#FFF7E8;color:#3B2F4F;border-color:#CDBFEA;min-height:50px;font-size:18px}.paper .slot{color:#7656B5}.paper .slot.ok{color:#1F6F50;background:#DDF5EA}
.page{background:var(--card);border:3px solid var(--bd);border-radius:28px;padding:20px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.txt{font-size:var(--fs);line-height:var(--lh);letter-spacing:var(--ls);word-spacing:.12em;display:flex;flex-direction:column;gap:10px}
.nav{display:flex;gap:12px}
.nav .btn{flex:1}
.slot{display:inline-block;min-width:3.2em;border-bottom:4px solid var(--coral);padding:0 .25em;margin:0 .1em;color:var(--ac)}
.slot.ok{color:var(--ok);border-color:var(--ok);background:var(--okbg);border-radius:12px}
.opts{display:flex;flex-direction:column;gap:12px}
.opts .btn{font-size:26px;min-height:68px}
.opts .btn.ok{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.opts .btn.no{background:var(--no);border-color:var(--bd);color:var(--mut)}
.msg{font-size:21px;line-height:1.45;text-align:center;font-weight:700;border-radius:22px;padding:14px 16px}
.msg.good{background:var(--okbg);color:var(--ok);font-size:26px}
.msg.soft{background:var(--no);color:var(--tx);font-weight:400}
.stars{font-size:44px;letter-spacing:.15em}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style></head>
<body><div id="app"></div>

let st={screen:'home'};
const save=()=>{try{localStorage.setItem('cuentos-cfg2',JSON.stringify(cfg))}catch(e){}};
function apply(){const r=document.documentElement;r.style.setProperty('--fs',cfg.fs+'px');r.style.setProperty('--ls',cfg.wide?'.08em':'.02em');r.style.setProperty('--lh',cfg.wide?'1.9':'1.6');if(cfg.theme==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',cfg.theme)}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.8;speechSynthesis.speak(u)}catch(e){}}
const stop=()=>{try{speechSynthesis.cancel()}catch(e){}};
const shuffle=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
function set(k,v){cfg[k]=v;save();apply();render()}
function settings(){return `<div class="panel">
<div class="row"><span>Tamaño de letra</span><span><button class="chip" onclick="set('fs',Math.max(20,cfg.fs-4))" aria-label="Letra más pequeña">A−</button> <button class="chip" onclick="set('fs',Math.min(38,cfg.fs+4))" aria-label="Letra más grande">A+</button></span></div>
<div class="row"><span>Letras más separadas</span><button class="chip" aria-pressed="${cfg.wide}" onclick="set('wide',!cfg.wide)">${cfg.wide?'Sí':'No'}</button></div>
<div class="row"><span>Una frase cada vez</span><button class="chip" aria-pressed="${cfg.focus}" onclick="set('focus',!cfg.focus)">${cfg.focus?'Sí':'No'}</button></div>
<div class="row"><span>Colores</span><span><button class="chip" aria-pressed="${cfg.theme==='light'}" onclick="set('theme','light')">Claros</button> <button class="chip" aria-pressed="${cfg.theme==='dark'}" onclick="set('theme','dark')">Oscuros</button></span></div></div>`}
const head=b=>`<div class="top">${b?`<button class="btn sq" onclick="go('home')" aria-label="Volver al inicio">←</button>`:'<span></span>'}<button class="btn sq" onclick="cfg.open=!cfg.open;render()" aria-label="Ajustes" aria-expanded="${cfg.open}">⚙️</button></div>${cfg.open?settings():''}`;
function go(s,e){stop();st=Object.assign({screen:s,bad:[]},e||{});cfg.open=false;render();window.scrollTo(0,0)}
function steps(s){const o=[];s.pages.forEach(p=>{if(cfg.focus)p[1].forEach(l=>o.push({n:p[0],l:[l]}));else o.push({n:p[0],l:p[1]})});return o}
function render(){
 if(st.screen==='home'){
  $.innerHTML=head(false)+`<h1>¿Qué cuento quieres leer?</h1>`+STORIES.map((s,i)=>`<button class="story" onclick="go('read',{i:${i},n:0})"><span class="th">${svg(SC[i][0]())}</span><span><b>${s.t}</b><span>${s.pages.length} páginas y un juego</span></span></button>`).join('');
 }else if(st.screen==='read'){
  const s=STORIES[st.i],a=steps(s),p=a[st.n],last=st.n===a.length-1;
  $.innerHTML=head(true)+`<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${a.length}" aria-valuenow="${st.n+1}"><i style="width:${(st.n+1)/a.length*100}%"></i></div>
  <div class="pic">${svg(SC[st.i][p.n]())}<div class="cap"><div class="paper"><div class="txt">${p.l.map(l=>`<p>${l}</p>`).join('')}</div></div><button class="btn" onclick="sayR()">🔊 Escuchar</button></div></div>
  
  <div class="nav"><button class="btn" ${st.n===0?'disabled':''} onclick="go('read',{i:${st.i},n:${st.n-1}})">Atrás</button>
  <button class="btn main" onclick="${last?`go('quiz',{i:${st.i},k:0,o:null,done:false,err:''})`:`go('read',{i:${st.i},n:${st.n+1}})`}">${last?'¡A jugar!':'Siguiente'}</button></div>`;
 }else if(st.screen==='quiz'){
  const s=STORIES[st.i],q=s.q[st.k];
  if(!st.o)st.o=shuffle(q[2]);
  const pt=q[0].split('___'),more=st.k+1<s.q.length;
  $.innerHTML=head(true)+`<div class="bar" aria-hidden="true"><i style="width:${st.k/s.q.length*100}%"></i></div>
  <div class="pic">${svg(SC[st.i][q[4]]())}<div class="cap"><div class="paper"><div class="txt"><p>${pt[0]}<span class="slot ${st.done?'ok':''}">${st.done?q[1]:'&nbsp;&nbsp;&nbsp;&nbsp;'}</span>${pt[1]}</p></div></div><button class="btn" onclick="sayQ()">🔊 Escuchar</button></div></div>
  
  <div class="opts">${st.o.map((w,j)=>{const b=st.bad.includes(w);return `<button class="btn ${st.done&&w===q[1]?'ok':''} ${b?'no':''}" ${st.done||b?'disabled':''} onclick="pick(${j})">${w}</button>`}).join('')}</div>
  <div aria-live="polite">${st.done?`<p class="msg good">${PRAISE[st.k%4]} ⭐</p>`:st.err?`<p class="msg soft">${st.err}</p>`:''}</div>
  ${st.done?`<button class="btn main" onclick="${more?`go('quiz',{i:${st.i},k:${st.k+1},o:null,done:false,err:''})`:`go('end',{i:${st.i}})`}">${more?'Siguiente pregunta':'Terminar'}</button>`:''}`;
 }else{
  const s=STORIES[st.i];
  $.innerHTML=head(false)+`<div class="page"><h1>¡Felicidades!</h1><div class="stars" aria-label="${s.q.length} estrellas">${'⭐'.repeat(s.q.length)}</div><p class="txt" style="font-size:22px">Leíste “${s.t}” y completaste todo el juego. ¡Lo hiciste muy bien!</p></div>
  <button class="btn main" onclick="go('read',{i:${st.i},n:0})">Leer otra vez</button><button class="btn" onclick="go('home')">Elegir otro cuento</button>`;
 }
}
function sayR(){const p=steps(STORIES[st.i])[st.n];say(p.l.join(' '))}
function sayQ(){const q=STORIES[st.i].q[st.k];say(q[0].replace('___',st.done?q[1]:'…'))}
function pick(j){const q=STORIES[st.i].q[st.k],w=st.o[j];if(w===q[1]){st.done=true;st.err='';say(PRAISE[st.k%4])}else{st.bad.push(w);st.err='¡Casi! '+q[3]+' Prueba otra vez.';say(q[3])}render()}
apply();render();
</script></body></html>
